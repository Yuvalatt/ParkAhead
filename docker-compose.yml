services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkahead}
      POSTGRES_USER: ${POSTGRES_USER:-parkahead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkahead}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__ParkAheadDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-parkahead};Username=${POSTGRES_USER:-parkahead};Password=${POSTGRES_PASSWORD:-changeme}"
      Frontend__Origin: "http://localhost:5173"
      EventSources__Provider: "${EVENT_SOURCE_PROVIDER:-Mock}"
      EventSources__Ticketmaster__ApiKey: "${TICKETMASTER_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
